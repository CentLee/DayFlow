name: Merge Ready Notify

on:
  workflow_run:
    workflows: [API CI, Harness CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: dayflow-merge-ready-${{ github.repository }}-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Notify merge-ready task PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAYFLOW_DISCORD_WEBHOOK_URL: ${{ secrets.DAYFLOW_DISCORD_WEBHOOK_URL }}
        run: scripts/github_merge_ready_notify.sh
