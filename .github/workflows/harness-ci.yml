name: Harness CI

on:
  push:
    paths:
      - "AGENTS.md"
      - ".codex/agents/**"
      - ".codex/skills/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".codex/agents/**"
      - ".codex/skills/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Verify toolchain
        run: |
          command -v git
          command -v jq
          command -v rg
      - name: Audit harness drift and shell syntax
        run: scripts/audit_harness_drift.sh
