services:
  postgres:
    image: postgres:16
    container_name: dayflow-postgres
    environment:
      POSTGRES_DB: dayflow
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
