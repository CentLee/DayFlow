services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dayflow_test
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
    ports:
      - "${DAYFLOW_POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAYFLOW_ADDR: ":8080"
      DAYFLOW_STORE_MODE: "postgres"
      DAYFLOW_SEED_MODE: "test"
      DAYFLOW_DATABASE_URL: "postgres://dayflow:dayflow@postgres:5432/dayflow_test?sslmode=disable"
      DAYFLOW_AUTO_MIGRATE: "true"
      DAYFLOW_MIGRATIONS_DIR: "/app/migrations"
      DAYFLOW_OWNER_GOOGLE_SUBJECT: "system-test-owner"
      DAYFLOW_OWNER_EMAIL: "owner@dayflow.local"
      DAYFLOW_PARTNER_GOOGLE_SUBJECT: "system-test-partner"
      DAYFLOW_PARTNER_EMAIL: "editor@dayflow.local"
    ports:
      - "${DAYFLOW_API_HOST_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
