services:
  postgres:
    image: postgres:16
    container_name: dayflow-system-postgres
    environment:
      POSTGRES_DB: dayflow_test
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow -d dayflow_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: dayflow-system-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DAYFLOW_ADDR: ":8080"
      DAYFLOW_STORE_MODE: "hybrid"
      DAYFLOW_DATABASE_URL: "postgres://dayflow:dayflow@postgres:5432/dayflow_test?sslmode=disable"
      DAYFLOW_AUTO_MIGRATE: "true"
      DAYFLOW_MIGRATIONS_DIR: "/app/migrations"
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
